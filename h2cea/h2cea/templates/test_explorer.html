<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2 Test Explorer</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s7: #6250d6; --other: #a9a79f;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --info: #2a78d6;
  --m0: #cde2fb; --m1: #86b6ef; --m2: #3987e5; --m3: #184f95;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s7: #9085e9; --other: #5d5c58;
    --info: #3987e5;
    --m0: #0d366b; --m1: #1c5cab; --m2: #3987e5; --m3: #b7d3f6;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 18px; padding: 0 16px; height: 44px; background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 14px; font-weight: 650; margin: 0; white-space: nowrap; }
nav { display: flex; gap: 2px; }
nav button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--ink2); }
nav button:hover { background: var(--wash); }
nav button[aria-selected=true] { background: var(--wash); color: var(--ink); font-weight: 600; }
.hd-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--ink2); font-size: 12px; white-space: nowrap; }
.hd-right label { display: flex; align-items: center; gap: 6px; }
.hd-right input[type=text] { width: 62px; }
#status { min-width: 120px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
main { padding: 14px 16px 40px; max-width: 1560px; margin: 0 auto; }
.view { display: none; }
.view.on { display: block; }
#view-test.on { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { #view-test.on { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.sec { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.sec:first-child { margin-top: 0; }
.steps { margin: 0 0 10px; padding: 0 0 10px 18px; color: var(--ink2); font-size: 12px; border-bottom: 1px solid var(--border); }
.steps li { margin: 1px 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fld > span { font-size: 11.5px; color: var(--ink2); }
.fld > span i { font-style: normal; color: var(--muted); }
input[type=text], input[type=date], select, textarea { width: 100%; background: var(--page); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 7px; height: 28px; }
textarea { height: 64px; resize: vertical; }
input.num { text-align: right; font-variant-numeric: tabular-nums; }
input::placeholder { color: var(--muted); font-size: 10.5px; opacity: .85; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--s1); outline-offset: -1px; }
input.bad { border-color: var(--crit); }
input.req:placeholder-shown { border-color: var(--s1); }
.chk { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--ink2); }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 11px; cursor: pointer; height: 28px; white-space: nowrap; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 11.5px; }
.res-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.res-head h2 { font-size: 16px; margin: 0; font-weight: 650; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--st, var(--axis)); border-radius: 6px; padding: 8px 11px; min-width: 0; }
.tile .l { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--ink2); }
.tile .l b { font-weight: 600; font-size: 10.5px; color: var(--ink2); display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st, var(--axis)); display: inline-block; flex: none; }
.tile .v { font-size: 22px; font-weight: 600; line-height: 1.25; }
.tile .v span { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: 3px; }
.tile .s, .tile .p { font-size: 11.5px; color: var(--ink2); overflow-wrap: anywhere; }
.tile .p { color: var(--muted); }
.findings { margin: 0 0 10px; padding: 0; list-style: none; }
.findings li { display: grid; grid-template-columns: 10px 62px 1fr; gap: 8px; align-items: baseline; padding: 5px 2px; border-top: 1px solid var(--border); }
.findings li:first-child { border-top: 0; }
.findings b { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--ink2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 6px 11px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--s1); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; color: var(--ink2); }
.seg button[aria-selected=true] { background: var(--wash); color: var(--ink); font-weight: 600; }
.ch-title { font-weight: 600; margin: 2px 0 2px; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink2); margin-bottom: 2px; min-height: 16px; }
.ch-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ch-legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.ch-legend i.pt { width: 8px; height: 8px; border: 0; border-radius: 50%; }
.ch-plot { position: relative; }
.ch-plot svg { display: block; width: 100%; }
.ch-plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ch-plot text.lab { fill: var(--ink2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px; font-size: 11.5px; box-shadow: 0 2px 10px rgba(0,0,0,.18); white-space: nowrap; display: none; z-index: 3; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip b { font-weight: 600; }
.cap { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-weight: 600; font-size: 11.5px; color: var(--ink2); position: sticky; top: 0; background: var(--surface); }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td.t, th.t { text-align: left; }
td.notes { white-space: normal; min-width: 220px; color: var(--ink2); text-align: left; }
tr.cur td { background: var(--wash); }
tbody tr:hover td { background: var(--wash); }
a.lnk { color: var(--s1); cursor: pointer; text-decoration: none; } a.lnk:hover { text-decoration: underline; }
.scroll { overflow: auto; max-height: 420px; }
.scrollx { overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
pre.sum { background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; margin: 0 0 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.empty { padding: 26px 10px; color: var(--ink2); text-align: center; }
details summary { cursor: pointer; color: var(--ink2); margin: 8px 0; }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--page); padding: 8px 12px; border-radius: 6px; display: none; z-index: 9; max-width: 420px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 10px; color: var(--ink2); }
.filters label { display: inline-flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
<header>
  <h1>E2 Test Explorer</h1>
  <nav id="nav">
    <button data-view="test" aria-selected="true">Test</button>
    <button data-view="campaign">Campaign</button>
    <button data-view="model">Model</button>
  </nav>
  <div class="hd-right">
    <label title="Baseline value. The model pc and thrust at the measured flows use it.">Model &eta; c* <input type="text" class="num" id="eta_c" inputmode="decimal"></label>
    <label title="Applied to the ideal vacuum Cf; the ambient term carries no loss.">&eta; Cf,vac <input type="text" class="num" id="eta_f" inputmode="decimal"></label>
    <label title="Six synthetic test points built from the model, to try the tool. Never saved."><input type="checkbox" id="demo"> Demo campaign</label>
    <span id="baseline"></span>
    <span id="status"></span>
  </div>
</header>
<main>
  <section class="view on" id="view-test">
    <aside class="card" id="form"></aside>
    <div id="results"></div>
  </section>
  <section class="view" id="view-campaign"></section>
  <section class="view" id="view-model"></section>
</main>
<div id="toast"></div>
<script>
"use strict";
// ------------------------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const has = v => v !== null && v !== undefined && !(typeof v === "number" && !isFinite(v));
const fx = (v, nd = 2, sign = false) => !has(v) ? "–" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(nd);
const num = s => { if (s === null || s === undefined) return null; s = String(s).trim().replace(",", "."); if (s === "") return null; const v = Number(s); return isFinite(v) ? v : NaN; };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const STATUS = {good: ["--good", "OK"], warn: ["--warn", "Check"], crit: ["--crit", "Off"], info: ["--info", "Note"]};
const ORDER = {crit: 0, warn: 1, good: 2, info: 3};

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3200); }
function status(msg) { $("#status").textContent = msg; }

// ------------------------------------------------------------------------------------ state
let META = null;
const S = {
  view: "test", tab: "Engine map", ymap: "pc", test: null, savedJson: null, eta_c: 0, eta_f: 0, demo: false,
  A: null, err: null, W: null, Wpending: false, line: null, lineKey: "", pool: [], nextId: "E2-HF-001",
  qratio: {}, picked: new Set(), sort: {k: "date", d: 1}, trend: "r_eta_cstar", sx: "r_OF", sy: "r_eta_cstar",
  fHw: null, fOut: null, model: null, modelLine: null,
};
let seqA = 0, seqW = 0, seqL = 0, seqM = 0;

const today = () => new Date().toISOString().slice(0, 10);
function blankTest(hw) {
  const t = {test_id: S.nextId, date: today(), hardware: hw || "E2-REG-1", outcome: "pass", pressures_gauge: false, notes: "", source: "", inputs: {}};
  for (const f of META.fields) t.inputs[f.key] = f.default;
  return t;
}
const inputsKey = t => JSON.stringify([t.hardware, t.pressures_gauge, t.inputs, S.eta_c, S.eta_f]);
const recJson = t => JSON.stringify([t.test_id, t.date, t.hardware, t.outcome, t.pressures_gauge, t.notes, t.inputs]);
const dirty = () => S.savedJson !== recJson(S.test);
const isDemo = () => S.test.test_id.toUpperCase().startsWith("DEMO");

// ------------------------------------------------------------------------------------ charts (SVG)
function ticks(lo, hi, n = 6) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return {vals: out, nd: Math.max(0, -Math.floor(Math.log10(step) + 1e-9))};
}
const sig = v => !has(v) ? "–" : Math.abs(v) >= 1000 ? v.toFixed(0) : Math.abs(v) >= 100 ? v.toFixed(1) : Math.abs(v) >= 10 ? v.toFixed(2) : v.toFixed(3);

/* chart(el, {title, xLabel, yLabel, height, series: [{name, x, y, color, width, dash, points, labels, r, colors, tag}],
              hlines: [{y, label, color, dash}], vlines: [{x, label, color, dash}], bands: [{y0, y1, color}],
              cats, yRange, xRange, aspect, under(sx, sy), legend}) */
function chart(el, o) {
  const series = (o.series || []).filter(s => s && s.x && s.x.length);
  const named = series.filter(s => s.name);
  el.innerHTML = (o.title ? `<div class="ch-title">${esc(o.title)}</div>` : "") +
    `<div class="ch-legend">${(o.legend === false || named.length < 2 && !o.forceLegend) ? "" : named.map(s =>
      `<span><i class="${s.points ? "pt" : ""}" style="${s.points ? "background" : "border-color"}:${s.color};${s.dash ? "border-top-style:dashed" : ""}"></i>${esc(s.name)}</span>`).join("")}</div>` +
    `<div class="ch-plot"><svg></svg><div class="tip"></div></div>`;
  const svg = $("svg", el), tip = $(".tip", el), W = Math.max(280, el.clientWidth);
  const m = {l: 56, r: 18, t: 10, b: o.xLabel ? 42 : 26};
  const rot = o.cats && Math.max(...o.cats.map(c => String(c).length)) * 6.6 > (W - 74) / o.cats.length;
  if (rot) m.b += 40;
  let xs = [], ys = [];
  for (const s of series) for (let i = 0; i < s.x.length; i++) { if (has(s.x[i])) xs.push(s.x[i]); if (has(s.y[i])) ys.push(s.y[i]); }
  for (const h of o.hlines || []) if (has(h.y) && h.fit !== false) ys.push(h.y);
  for (const b of o.bands || []) ys.push(b.y0, b.y1);
  if (!xs.length || !ys.length) { el.innerHTML += `<div class="empty">No data to plot.</div>`; return; }
  let [x0, x1] = o.xRange || [Math.min(...xs), Math.max(...xs)], [y0, y1] = o.yRange || [Math.min(...ys), Math.max(...ys)];
  if (o.cats) { x0 = -0.5; x1 = o.cats.length - 0.5; }
  else if (!o.xRange) { const p = (x1 - x0) * 0.04 || Math.abs(x0) * 0.05 || 1; x0 -= p; x1 += p; }
  if (!o.yRange) { const p = (y1 - y0) * 0.1 || Math.abs(y0) * 0.02 || 1; y0 -= p; y1 += p; }
  let H = o.height || 320;
  if (o.aspect) H = Math.min(330, m.t + m.b + (W - m.l - m.r) * (y1 - y0) / (x1 - x0));
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const sx = v => m.l + (v - x0) / (x1 - x0) * pw, sy = v => m.t + ph - (v - y0) / (y1 - y0) * ph;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  let g = "";
  const ty = ticks(y0, y1, Math.max(3, Math.round(ph / 55)));
  for (const v of ty.vals) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="${m.l - 7}" y="${sy(v) + 4}" text-anchor="end">${v.toFixed(ty.nd)}</text>`;
  if (o.cats) {
    const every = Math.ceil(o.cats.length / Math.max(1, Math.floor(pw / 26)));
    o.cats.forEach((c, i) => { if (i % every) return;
      g += rot ? `<text transform="translate(${sx(i) + 4},${m.t + ph + 12}) rotate(40)">${esc(c)}</text>` : `<text x="${sx(i)}" y="${m.t + ph + 16}" text-anchor="middle">${esc(c)}</text>`; });
  } else {
    const tx = ticks(x0, x1, Math.max(3, Math.round(pw / 90)));
    for (const v of tx.vals) g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--grid)"/><text x="${sx(v)}" y="${m.t + ph + 16}" text-anchor="middle">${v.toFixed(tx.nd)}</text>`;
  }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}" stroke="var(--axis)"/>`;
  if (o.xLabel) g += `<text class="lab" x="${m.l + pw / 2}" y="${H - 6}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  if (o.yLabel) g += `<text class="lab" transform="translate(13,${m.t + ph / 2}) rotate(-90)" text-anchor="middle">${esc(o.yLabel)}</text>`;
  const cid = "c" + Math.random().toString(36).slice(2);
  g += `<clipPath id="${cid}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath><g clip-path="url(#${cid})">`;
  if (o.under) g += o.under(sx, sy);
  for (const b of o.bands || []) g += `<rect x="${m.l}" width="${pw}" y="${sy(b.y1)}" height="${Math.abs(sy(b.y0) - sy(b.y1))}" fill="${b.color}" opacity=".10"/>`;
  for (const h of o.hlines || []) if (has(h.y)) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(h.y)}" y2="${sy(h.y)}" stroke="${h.color || "var(--muted)"}" stroke-width="1.3" stroke-dasharray="${h.dash === false ? "" : "5 4"}"/>`;
  for (const v of o.vlines || []) if (has(v.x)) g += `<line x1="${sx(v.x)}" x2="${sx(v.x)}" y1="${m.t}" y2="${m.t + ph}" stroke="${v.color || "var(--muted)"}" stroke-width="1.3" stroke-dasharray="${v.dash === false ? "" : "2 4"}"/>`;
  for (const s of series) {
    if (!s.points || s.line) {
      let d = "", pen = false;
      for (let i = 0; i < s.x.length; i++) { if (!has(s.y[i]) || !has(s.x[i])) { pen = false; continue; } d += (pen ? "L" : "M") + sx(s.x[i]).toFixed(1) + " " + sy(s.y[i]).toFixed(1); pen = true; }
      g += `<path d="${d}" fill="none" stroke="${s.points ? "var(--other)" : s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${s.dash ? "6 5" : ""}"/>`;
    }
  }
  g += "</g>";
  for (const h of o.hlines || []) if (has(h.y) && h.label) g += `<text x="${W - m.r - 4}" y="${sy(h.y) - 4}" text-anchor="end">${esc(h.label)}</text>`;
  for (const v of o.vlines || []) if (has(v.x) && v.label) g += `<text x="${sx(v.x) + 4}" y="${m.t + 11}">${esc(v.label)}</text>`;
  for (const s of series) if (s.points) for (let i = 0; i < s.x.length; i++) {
    if (!has(s.y[i]) || !has(s.x[i])) continue;
    const r = (s.rs && s.rs[i]) || s.r || 5, c = (s.colors && s.colors[i]) || s.color;
    g += `<circle cx="${sx(s.x[i])}" cy="${sy(s.y[i])}" r="${r}" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
    if (s.tag && s.labels && s.x.length <= (s.tagMax || 14)) g += `<text class="lab" x="${sx(s.x[i])}" y="${sy(s.y[i]) - r - 5}" text-anchor="middle">${esc(s.labels[i])}</text>`;
  }
  g += `<line class="xh" y1="${m.t}" y2="${m.t + ph}" stroke="var(--axis)" style="display:none"/>`;
  svg.innerHTML = g;
  const xh = $(".xh", svg), box = $(".ch-plot", el);
  const xname = v => o.cats ? esc(o.cats[Math.round(v)] ?? "") : `${esc(o.xShort || o.xLabel || "x")} ${sig(v)}`;
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
    let best = null;
    for (const s of series) if (s.points) for (let i = 0; i < s.x.length; i++) {
      if (!has(s.y[i]) || !has(s.x[i])) continue;
      const d = Math.hypot(sx(s.x[i]) - px, sy(s.y[i]) - py);
      if (d < 22 && (!best || d < best.d)) best = {d, s, i};
    }
    let html = "";
    if (best) {
      const {s, i} = best;
      html = `<div><b>${esc(s.labels ? s.labels[i] : s.name)}</b></div><div>${xname(s.x[i])}</div><div>${esc(o.yShort || o.yLabel || "y")} ${sig(s.y[i])}</div>` + (s.extra ? `<div>${esc(s.extra[i])}</div>` : "");
      xh.style.display = "none";
    } else if (px >= m.l && px <= W - m.r && series.some(s => !s.points)) {
      const xv = x0 + (px - m.l) / pw * (x1 - x0);
      html = `<div><b>${xname(xv)}</b></div>`;
      for (const s of series) if (!s.points) {
        let bi = -1, bd = Infinity;
        for (let i = 0; i < s.x.length; i++) { const d = Math.abs(s.x[i] - xv); if (has(s.y[i]) && d < bd) { bd = d; bi = i; } }
        if (bi >= 0 && bd <= (x1 - x0) * 0.05) html += `<div><i class="dot" style="background:${s.color}"></i>${esc(s.name || "")} ${sig(s.y[bi])}</div>`;
      }
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
    }
    if (!html) { tip.style.display = "none"; return; }
    tip.innerHTML = html; tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(px + 14, box.clientWidth - tw - 4) + "px"; tip.style.top = Math.max(0, py - 10) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; xh.style.display = "none"; };
}

    </div>

  $("#new").onclick = () => { if (confirmLeave()) loadTest(blankTest(S.test.hardware), false); };
  $("#save").onclick = save;
  $("#del").onclick = del;
}
function confirmLeave() { return !dirty() || !S.A || isDemo() || confirm(`Discard the unsaved changes to ${S.test.test_id || "this test"}?`); }
function fillForm() {
  for (const el of $$("[data-in]")) {
    const f = META.fields.find(f => f.key === el.dataset.in), v = S.test.inputs[f.key];
    el.value = has(v) ? String(Number(Number(v).toFixed(Math.max(f.decimals, 4)))) : ""; el.classList.remove("bad");
  }
  for (const el of $$("[data-meta]")) { const k = el.dataset.meta; if (el.type === "checkbox") el.checked = !!S.test[k]; else el.value = S.test[k] ?? ""; }
}
let debounce;
function onFormInput(ev) {
  const el = ev.target;
  if (el.dataset.in) { const v = num(el.value); el.classList.toggle("bad", Number.isNaN(v)); S.test.inputs[el.dataset.in] = Number.isNaN(v) ? null : v; }
  else if (el.dataset.meta) { S.test[el.dataset.meta] = el.type === "checkbox" ? el.checked : el.value; }
  else return;
  localStorage.setItem("e2x_draft", JSON.stringify(S.test));
  clearTimeout(debounce); debounce = setTimeout(analyse, 90);
  renderSaveInfo();
}
function renderOpen() {
  const ids = S.pool.map(p => p.test.test_id).reverse();

}
function renderSaveInfo() {

  $("#save").disabled = !S.A || isDemo() || !S.test.test_id.trim();
  $("#del").disabled = !saved;
  $("#saveinfo").textContent = isDemo() ? "Demo points are not saved. Give the test its own ID to save it." :
    !S.test.test_id.trim() ? "Give the test an ID to save it." : saved ? (dirty() ? "Unsaved changes." : "Saved in hotfire_tests/.") : "Not saved yet.";
}
function loadTest(t, saved) {
  S.test = JSON.parse(JSON.stringify(t)); delete S.test.demo; delete S.test.saved;
  for (const f of META.fields) if (!(f.key in S.test.inputs)) S.test.inputs[f.key] = null;
  S.savedJson = saved ? recJson(S.test) : null; S.W = null; S.A = null;
  localStorage.setItem("e2x_draft", JSON.stringify(S.test));
  fillForm(); $("#open").value = ""; analyse();
}
function openTest(id) {

}
async function save() {

    const r = await api("/api/save", {test: S.test});
    S.savedJson = recJson(S.test); toast(`${r.updated ? "Updated" : "Saved"} ${r.file}`);
    await loadPool(); renderSaveInfo();

}
async function del() {
  if (!confirm(`Delete ${S.test.test_id} from hotfire_tests/?`)) return;
  await api("/api/delete", {test_id: S.test.test_id}); S.savedJson = null; toast(`Deleted ${S.test.test_id}`);
  await loadPool(); renderSaveInfo();
}

// ------------------------------------------------------------------------------------ model calls
async function analyse() {
  const my = ++seqA, t0 = performance.now(), key = inputsKey(S.test);
  let d;
  try { d = await api("/api/analyse", {test: S.test, eta_c: S.eta_c, eta_f: S.eta_f, demo: S.demo}); }
  catch (e) { d = {error: e.message}; }
  if (my !== seqA) return;
  if (d.error) { S.A = null; S.err = d.error; S.W = null; status(""); }
  else {
    S.err = null;
    if (!S.A || S.A.key !== key) S.W = null;
    S.A = d; S.A.key = key;
    status(`analysed in ${Math.round(performance.now() - t0)} ms`);
    if (d.jacket && !S.W) jacket(key);
    else if (!d.jacket) { S.W = null; S.Wpending = false; }
    ensureLine();
  }
  render();
}
async function jacket(key) {
  const my = ++seqW; S.Wpending = true;
  try {
    const d = await api("/api/jacket", {test: S.test, eta_c: S.eta_c, eta_f: S.eta_f, demo: S.demo, fit: true});
    if (my !== seqW || !S.A || S.A.key !== key) return;
    S.W = d.W; S.Wpending = false;
    if (S.W) S.qratio[key] = S.W.Q_ratio;
  } catch (e) { if (my !== seqW) return; S.W = null; S.Wpending = false; }
  render();
}
function lineRange() {
  const ofs = [S.A.R.OF, ...peers().map(p => p.row.r_OF)].filter(has);
  return [Math.max(1.2, Math.floor((Math.min(...ofs) - 0.4) * 2) / 2), Math.min(7.5, Math.ceil((Math.max(...ofs) + 0.4) * 2) / 2)];
}
async function ensureLine() {
  const R = S.A.R, [lo, hi] = lineRange();
  const body = {hardware: S.test.hardware, fuel_flow_kg_s: S.test.inputs.fuel_flow_kg_s, T_ox_K: R.T_ox_K, pa_bar: R.pa_bar,
                throat_d_mm: S.test.inputs.throat_d_mm, eta_c: S.eta_c, eta_f: S.eta_f, lo, hi};
  const key = JSON.stringify(body);
  if (key === S.lineKey) return;
  S.lineKey = key; S.line = null; const my = ++seqL;
  try { const d = await api("/api/line", body); if (my !== seqL) return; S.line = d.line; } catch (e) { return; }
  if (S.view === "test" && S.tab === "Engine map") renderTab();
}
async function loadPool(reload) {
  const d = await api(`/api/tests?demo=${S.demo ? 1 : 0}&eta_c=${S.eta_c}&eta_f=${S.eta_f}${reload ? "&reload=1" : ""}`);
  S.pool = d.tests; S.nextId = d.next_id;
  renderOpen();
  if (S.view === "campaign") renderCampaign();
  fillQratio();
}
async function fillQratio() {       // jacket heat measured / model for the campaign table, filled in as it arrives
  for (const p of S.pool) {
    if (!p.jacket) continue;
    const key = inputsKey(p.test);
    if (key in S.qratio) continue;
    S.qratio[key] = null;
    api("/api/jacket", {test: p.test, eta_c: S.eta_c, eta_f: S.eta_f, fit: false}).then(d => {
      if (d.W) { S.qratio[key] = d.W.Q_ratio; if (S.view === "campaign") renderCampaign(); }
    }).catch(() => {});
  }
}
// tests of the pool on the same hardware, other than the one in the form
const peers = () => S.pool.filter(p => p.row && p.test.test_id !== S.test.test_id && p.test.hardware === S.test.hardware);

// ------------------------------------------------------------------------------------ results
function render() {
  renderSaveInfo();
  if (S.view === "test") renderResults();
  if (S.view === "campaign") renderCampaign();
}
function tile(label, val, unit, sub, st, prev) {
  const s = STATUS[st];
  return `<div class="tile" style="${s ? `--st:var(${s[0]})` : ""}"><div class="l"><span>${label}</span>${s ? `<b><i class="dot"></i>${s[1]}</b>` : ""}</div>
    <div class="v">${val}<span>${unit}</span></div><div class="s">${sub}</div>${prev ? `<div class="p">${prev}</div>` : ""}</div>`;
}
function renderResults() {
  const el = $("#results"), t = S.test;
  if (!S.A) {
    el.innerHTML = `<div class="card empty">${S.err ? `Enter the chamber pressure, the oxidiser flow and the fuel flow to see the results.<div class="cap">${esc(S.err)}</div>` : "Computing."}</div>`;
    return;
  }
  const R = S.A.R, W = S.W, obs = (W && W.obs) || S.A.obs, last = S.A.last;

    const d = R[k] - last["r_" + k];

  };
  const tiles = [
    tile("&eta; c*", fx(R.eta_cstar, 3), "", `model ${fx(S.eta_c, 3)} · c* ${fx(R.cstar_meas_m_s, 0)} / ${fx(R.cstar_ideal_m_s, 0)} m/s`, lvl("η c*"), vs("eta_cstar")),
    tile("Chamber pressure", fx(R.pc_abs_bar, 2), "bar abs", `model ${fx(R.pc_model_bar, 2)} · ${fx(R.pc_dev_pct, 1, true)} %`, lvl("η c*"), vs("pc_abs_bar", 2)),
  ];
  if (has(R.thrust_N)) tiles.push(
    tile("Thrust", fx(R.thrust_N, 0), "N", `model ${fx(R.thrust_model_N, 0)} · ${fx(R.thrust_dev_pct, 1, true)} % · ${fx(R.throttle_pct, 0)} % rated`, lvl("η Cf"), vs("thrust_N", 0)),
    tile("Isp (sea level)", fx(R.isp_meas_s, 1), "s", `model ${fx(R.isp_model_s, 1)} · ideal ${fx(R.isp_ideal_s, 1)}`, lvl("η Cf"), vs("isp_meas_s", 1)),
    tile("&eta; Cf,vac", fx(R.eta_cf_vac, 3), "", `model ${fx(S.eta_f, 3)} · Cf ${fx(R.cf_meas, 3)} / ${fx(R.cf_ideal, 3)}`, lvl("η Cf"), vs("eta_cf_vac")));
  else tiles.push(tile("Thrust (model)", fx(R.thrust_model_N, 0), "N", `${fx(R.throttle_pct, 0)} % rated · no load cell value`, "info"));
  tiles.push(tile("O/F", fx(R.OF, 2), "", `flow ${fx(R.mdot_kg_s, 3)} kg/s · Tc ${fx(R.Tc_K, 0)} K`, null, vs("OF", 2)));
  const sep = R.summerfield_sep || has(R.x_sep_mm);
  tiles.push(tile("Nozzle pe / pa", fx(R.pe_over_pa, 2), "", has(R.x_sep_mm) ? `separated at x ${fx(R.x_sep_mm, 0)} mm` : R.summerfield_sep ? "separated (Summerfield)" : `attached · pe ${fx(R.pe_bar, 2)} bar`, sep ? "warn" : "good"));
  if (has(R.stiff_ox_pct) || has(R.stiff_fuel_pct)) {
    const worst = Math.min(...[R.stiff_ox_pct, R.stiff_fuel_pct].filter(has));
    const cda = [["CdA_ox_mm2", "ox"], ["CdA_fuel_mm2", "fuel"]].filter(([k]) => has(R[k])).map(([k, n]) => `${n} CdA ${fx(R[k], 2)}`).join(" · ");
    tiles.push(tile("Injector stiffness", fx(worst, 0), "% pc (min)", [has(R.stiff_ox_pct) ? `ox ${fx(R.stiff_ox_pct, 0)} %` : "", has(R.stiff_fuel_pct) ? `fuel ${fx(R.stiff_fuel_pct, 0)} %` : ""].filter(Boolean).join(" · "),
      worst >= META.stiffness_min_pct ? "good" : "warn", (cda ? cda + " mm²" : "") + (vs("CdA_ox_mm2") ? ` · ox ${vs("CdA_ox_mm2", 3, true)}` : "")));
  }

    ? tile("Jacket heat", fx(R.Q_meas_kW, 0), "kW", `model ${fx(W.Q_model_kW, 0)} · Bartz fit ×${fx(W.bartz_fit, 2)}`, "info", `hot wall ${fx(W.Twg_max_fit_K, 0)} K (limit ${fx(META.T_wg_limit_K, 0)})`)
    : tile("Jacket heat", fx(R.Q_meas_kW, 0), "kW", S.Wpending ? "jacket model running" : `${fx(R.q_per_ox_kJ_kg, 0)} kJ per kg N2O`, "info"));
  const sorted = [...obs].sort((a, b) => ORDER[a[0]] - ORDER[b[0]]);

      <span class="muted">${esc(t.date)} · ${esc(t.hardware)} · throat ${fx(R.throat_d_mm, 2)} mm · &epsilon; ${fx(R.eps, 2)} · ${esc(META.outcomes[t.outcome])}</span>
      ${isDemo() ? `<span class="tag">Demo data</span>` : ""}</div>
    <div class="tiles">${tiles.join("")}</div>
    <div class="card" style="padding:6px 12px;margin-bottom:10px"><ul class="findings">${sorted.map(([lv, tx]) =>
      `<li style="--st:var(${STATUS[lv][0]})"><i class="dot"></i><b>${STATUS[lv][1]}</b><span>${esc(tx)}</span></li>`).join("")}</ul></div>
    <div class="card"><div class="tabs">${tabs.map(n => `<button aria-selected="${n === S.tab}" data-tab="${n}">${n}</button>`).join("")}</div><div id="tab"></div></div>`;
  $$("[data-tab]", el).forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderResults(); });
  renderTab();
}
function renderTab() {
  const el = $("#tab"); if (!el || !S.A) return;
  ({"Engine map": tabMap, "Nozzle": tabNozzle, "Jacket": tabJacket, "Injector": tabInjector, "Summary": tabSummary})[S.tab](el);
}
const YMAP = {pc: ["Chamber pressure", "pc_abs_bar", "pc [bar]"], thrust: ["Thrust", "thrust_N", "thrust [N]"], cstar: ["c*", "cstar_meas_m_s", "c* [m/s]"], isp: ["Isp", "isp_meas_s", "Isp sea level [s]"]};

      g += `<rect x="${sx(x)}" width="${Math.max(1, sx(nz.x_mm[i + 1]) - sx(x) + 0.6)}" y="${sy(rr)}" height="${sy(-rr) - sy(rr)}" fill="${col(nz.M[i])}"/>`; } return g; }});

      <label class="fld" style="width:150px"><span>Ambient pressure <i>[bar]</i></span><input type="text" class="num" id="m_pa" value="${M.pa}"></label>
      <span class="grow"></span><button class="btn" id="cea" title="Ideal CEA values on a pc × O/F grid for this hardware, as JSON">Download CEA map</button></div></div>
    <div class="grid2"><div class="card" id="m1"></div><div class="card" id="m2"></div></div>
    <details class="card" style="margin-top:12px"><summary>Throttle line table</summary><div id="mt" class="scroll"></div></details>
    <details class="card" style="margin-top:12px"><summary>Model notes</summary><ul class="muted" style="margin:4px 0;padding-left:18px">
      <li>CEA: shifting equilibrium, real-fluid liquid N2O card at the N2O temperature and the supply pressure (${fx(META.p_tank_bar, 0)} bar; the feed throttles isenthalpically), ethanol ${fx(META.ethanol_wt, 0)} wt%. Same as the engine table.</li>
      <li>&eta; c* = pc·At/flow / c*(CEA at pc, O/F). &eta; Cf,vac = (F + pa·Ae)/(pc·At) / Cf,vac(CEA), the split used by the baseline (&eta; c* ${META.eta_c}, &eta; Cf,vac ${META.eta_f}). A measured throat diameter changes At and &epsilon;.</li>
      <li>Model at the measured flows: pc from flow·&eta; c*·c*(pc)/At (fixed point), thrust from &eta; Cf,vac.</li>
      <li>Nozzle: wall pressure from the 1D area ratio with a constant &gamma; that matches the CEA exit pressure; Schmucker separation criterion; Summerfield pe &lt; 0.4 pa as in run_engine_table.py.</li>
      <li>Jacket: regen.march for the E2-REG-1 as built (water, liquid-only), Bartz factor fitted to the calorimetric heat.</li>
      <li>Injector CdA with liquid density; for N2O below its saturation pressure the saturated liquid density (compare between tests, not with a single-phase design value).</li></ul></details>`;
  const upd = () => { const mf = num($("#m_mf").value), T = num($("#m_T").value), pa = num($("#m_pa").value);
    if (![mf, T, pa].every(v => has(v) && !Number.isNaN(v)) || mf <= 0) return;
    Object.assign(M, {hardware: $("#m_hw").value, mf, T, pa}); modelLine(); };
  ["m_hw", "m_mf", "m_T", "m_pa"].forEach(id => $("#" + id).onchange = upd);
  $("#cea").onclick = async () => { const b = $("#cea"); b.disabled = true; b.textContent = "Computing the CEA map (about 10 s)";
    try { const d = await api(`/api/cea_map?hardware=${encodeURIComponent(M.hardware)}&T_ox_K=${M.T + 273.15}&pa_bar=${M.pa}`);
      download(new Blob([JSON.stringify(d, null, 1)], {type: "application/json"}), `e2_cea_map_${M.hardware.replace(/ /g, "_")}_eps${fx(d.eps, 2)}.json`); }
    catch (e) { toast(e.message); } b.disabled = false; b.textContent = "Download CEA map"; };
  S.modelLine ? drawModel() : modelLine();
}
async function modelLine() {
  const M = S.model, my = ++seqM;
  $("#m1").innerHTML = $("#m2").innerHTML = `<div class="empty">Throttle line running.</div>`;
  try { const d = await api("/api/line", {hardware: M.hardware, fuel_flow_kg_s: M.mf, T_ox_K: M.T + 273.15, pa_bar: M.pa, eta_c: S.eta_c, eta_f: S.eta_f, lo: 1.6, hi: 5.4});
    if (my !== seqM) return; S.modelLine = d.line; if (S.view === "model") drawModel(); }
  catch (e) { $("#m1").innerHTML = `<div class="empty">${esc(e.message)}</div>`; $("#m2").innerHTML = ""; }
}
function drawModel() {
  const ln = S.modelLine, x = ln.map(r => r.ox_flow_kg_s);
  const two = k => [{name: "CEA ideal", x, y: ln.map(r => r[k + "_ideal"]), color: "var(--s3)", dash: true}, {name: "model", x, y: ln.map(r => r[k + "_model"]), color: "var(--s2)"}];
  chart($("#m1"), {title: "Thrust against oxidiser flow", xLabel: "ox flow [kg/s]", yLabel: "thrust [N]", height: 330, series: two("thrust"),
    hlines: [{y: 0.5 * META.F_rated_N, label: "50 % rated", fit: false}, {y: META.F_rated_N, label: "100 % rated", fit: false}]});
  chart($("#m2"), {title: "Chamber pressure against oxidiser flow", xLabel: "ox flow [kg/s]", yLabel: "pc [bar]", height: 330, series: two("pc")});
  $("#mt").innerHTML = `<table><thead><tr><th>throttle %</th><th>ox kg/s</th><th>O/F</th><th>pc bar</th><th>F N</th><th>Isp s</th><th>c* m/s (delivered)</th><th>Tc K</th></tr></thead><tbody>${ln.map(r =>
    `<tr><td>${fx(100 * r.thrust_model / META.F_rated_N, 0)}</td><td>${fx(r.ox_flow_kg_s, 3)}</td><td>${fx(r.OF, 2)}</td><td>${fx(r.pc_model, 2)}</td><td>${fx(r.thrust_model, 0)}</td><td>${fx(r.isp_model, 1)}</td><td>${fx(r.cstar_model, 0)}</td><td>${fx(r.Tc_model, 0)}</td></tr>`).join("")}</tbody></table>`;
}

// ------------------------------------------------------------------------------------ shell
function setView(v) {
  S.view = v;
  $$("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "view-" + v));
  if (v === "test") renderResults(); else if (v === "campaign") renderCampaign(); else renderModel();
}
async function etaChanged() {
  const c = num($("#eta_c").value), f = num($("#eta_f").value);
  if (!(c > 0.5 && c < 1.2) || !(f > 0.5 && f < 1.2)) { toast("Efficiencies must be between 0.5 and 1.2"); $("#eta_c").value = S.eta_c; $("#eta_f").value = S.eta_f; return; }
  S.eta_c = c; S.eta_f = f; S.modelLine = null; S.W = null;
  await loadPool(); analyse(); if (S.view === "model") renderModel();
}
async function init() {
  META = await api("/api/meta");
  S.eta_c = META.eta_c; S.eta_f = META.eta_f;
  $("#eta_c").value = S.eta_c; $("#eta_f").value = S.eta_f;
  $("#baseline").textContent = `Baseline rev ${META.baseline.revision}`;
  $("#baseline").title = `h2_baseline ${META.baseline.date}: rated ${META.F_rated_N} N, pc ${META.pc_rated_bar} bar, fuel ${META.fuel_flow_kg_s} kg/s`;
  S.demo = localStorage.getItem("e2x_demo") === "1"; $("#demo").checked = S.demo;
  buildForm();
  await loadPool();
  let draft = null; try { draft = JSON.parse(localStorage.getItem("e2x_draft")); } catch (e) {}
  if (draft && draft.inputs && META.hardware[draft.hardware]) {
    const p = S.pool.find(p => p.saved && p.test.test_id === draft.test_id);
    loadTest(draft, false); if (p && recJson(p.test) === recJson(S.test)) S.savedJson = recJson(S.test);
  } else loadTest(blankTest(), false);
  $$("#nav button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("#eta_c").onchange = $("#eta_f").onchange = etaChanged;
  $("#demo").onchange = async e => { S.demo = e.target.checked; localStorage.setItem("e2x_demo", S.demo ? "1" : "0"); await loadPool(); analyse(); };
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => setView(S.view), 150); });
}
init().catch(e => { document.querySelector("main").innerHTML = `<div class="card empty">Could not reach the model server: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
