<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2 Test Explorer</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #fdfdfc; --sunk: #f1f1ed; --ink: #0b0b0b; --ink2: #52514e; --muted: #86847e;
  --grid: #e6e5df; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.045); --sel: rgba(42,120,214,.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s7: #6250d6; --other: #a9a79f;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --info: #2a78d6;
  --m0: #cde2fb; --m1: #86b6ef; --m2: #3987e5; --m3: #184f95;
  --bar: 46px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #1a1a19; --sunk: #141413; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8b8983;
    --grid: #2c2c2a; --axis: #3d3d3a; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.055); --sel: rgba(57,135,229,.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s7: #9085e9; --other: #5d5c58;
    --info: #3987e5;
    --m0: #0d366b; --m1: #1c5cab; --m2: #3987e5; --m3: #b7d3f6;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; }

/* top bar */
header { display: flex; align-items: center; gap: 20px; padding: 0 16px; height: var(--bar); background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 6; }
header h1 { font-size: 14px; font-weight: 650; white-space: nowrap; }
nav { display: flex; gap: 2px; align-self: stretch; }
nav button { border: 0; background: none; padding: 0 13px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; border-top: 2px solid transparent; }
nav button:hover { color: var(--ink); }
nav button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--s1); }
.hd-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--ink2); font-size: 12px; white-space: nowrap; }
#assume { border: 1px solid var(--border); border-radius: 6px; background: none; padding: 4px 10px; cursor: pointer; color: var(--ink2); }
#assume:hover { background: var(--wash); color: var(--ink); }
#status { min-width: 116px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* layout */
.view { display: none; }
.view.on { display: block; }
#view-test.on { display: grid; grid-template-columns: 230px 312px minmax(0, 1fr); align-items: start; }
.pane { position: sticky; top: var(--bar); height: calc(100vh - var(--bar)); overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
#rail { background: var(--sunk); display: flex; flex-direction: column; }
#work { padding: 16px 20px 48px; min-width: 0; }
.page { padding: 16px 20px 48px; max-width: 1560px; margin: 0 auto; }
@media (max-width: 1180px) {
  #view-test.on { grid-template-columns: 220px minmax(0, 1fr); }
  #inputs { grid-column: 2; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); columns: 2 280px; column-gap: 28px; }
  #inputs > * { break-inside: avoid; }
  #inputs .sec { margin-top: 0; padding-top: 12px; break-after: avoid; }
  #work { grid-column: 2; }
  #rail { grid-row: 1 / span 2; }
}

/* shared pieces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.sec { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); } .ink2 { color: var(--ink2); } .small { font-size: 11.5px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0 12px; cursor: pointer; height: 30px; white-space: nowrap; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.quiet { border-color: transparent; background: none; color: var(--ink2); }
.btn.quiet:hover { background: var(--wash); color: var(--ink); }
input[type=text], input[type=date], input[type=search], select, textarea { width: 100%; background: var(--page); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; height: 27px; }
textarea { height: 76px; resize: vertical; padding: 6px 8px; }
input.num { text-align: right; font-variant-numeric: tabular-nums; }
input::placeholder, textarea::placeholder { color: var(--muted); font-size: 11.5px; }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: -1px; }
input.bad { border-color: var(--crit); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st, var(--axis)); display: inline-block; flex: none; }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink2); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.cap { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.empty { padding: 26px 10px; color: var(--ink2); text-align: center; }
a.lnk { color: var(--s1); cursor: pointer; text-decoration: none; } a.lnk:hover { text-decoration: underline; }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--page); padding: 8px 12px; border-radius: 6px; display: none; z-index: 9; max-width: 440px; }

/* rail: the list of tests */
.rail-top { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
#rail-list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
.grp { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 8px 4px; }
.grp button { border: 0; background: none; color: var(--s1); cursor: pointer; font-size: 11.5px; padding: 0; }
.item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--wash); }
.item[aria-current=true] { background: var(--sel); }
.item .id { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .val { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12px; }
.item .ring { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--s1); }
.rail-foot { border-top: 1px solid var(--border); padding: 9px 14px; font-size: 11.5px; color: var(--ink2); display: flex; flex-direction: column; gap: 5px; }
.rail-foot label { display: flex; align-items: center; gap: 7px; }

/* inputs: a property sheet */
#inputs { padding: 14px 14px 30px; }
#inputs .sec { margin: 16px 0 6px; display: flex; justify-content: space-between; }
#inputs .sec:first-child { margin-top: 0; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) 84px 30px; gap: 6px; align-items: center; min-height: 31px; }
.pr > span:first-child { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .u { color: var(--muted); font-size: 11.5px; }
.pr.wide { grid-template-columns: 96px minmax(0, 1fr); }
.pr .src { font-size: 9.5px; font-weight: 600; letter-spacing: .04em; color: var(--s1); margin-left: 5px; vertical-align: 1px; }
.pr input.req:placeholder-shown { border-color: var(--s1); }
.chk { display: flex; align-items: center; gap: 7px; margin: 5px 0 2px; color: var(--ink2); }

/* work area */
.thead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.thead h2 { font-size: 19px; font-weight: 650; }
.thead .meta { color: var(--ink2); }
.verdict { border-left: 4px solid var(--st); padding: 11px 14px; margin-bottom: 12px; }
.verdict .vh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict .vh b { font-size: 15px; font-weight: 650; }
.find { list-style: none; margin: 8px 0 0; padding: 0; }
.find li { display: grid; grid-template-columns: 10px 50px minmax(0, 1fr) auto; gap: 9px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--border); }
.find li b { font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); }
.find li button { border: 0; background: none; color: var(--s1); cursor: pointer; font-size: 11.5px; padding: 0; white-space: nowrap; }
.find li button:hover { text-decoration: underline; }
details > summary { cursor: pointer; color: var(--ink2); }
.verdict details { margin-top: 6px; }
.verdict details > summary { font-size: 12px; padding: 3px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.kpi .l { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink2); }
.kpi .v { font-size: 23px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.kpi .v span { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: 3px; letter-spacing: 0; }
.kpi .s { font-size: 11.5px; color: var(--ink2); }
.kpi .p { font-size: 11.5px; color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 0 -14px 12px; padding: 0 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--s1); font-weight: 600; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; align-items: start; }
.split.wide { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.split > div { min-width: 0; }
.split > div:first-child > table { display: block; overflow-x: auto; }
@media (max-width: 1340px) { .split { grid-template-columns: 1fr; } }
@media (max-width: 1520px) { .split.wide { grid-template-columns: 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; color: var(--ink2); }
.seg button[aria-selected=true] { background: var(--wash); color: var(--ink); font-weight: 600; }

/* tables */
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-weight: 600; font-size: 11.5px; color: var(--ink2); background: var(--surface); }
.scroll th { position: sticky; top: 0; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td.t, th.t { text-align: left; }
td.t i { font-style: normal; color: var(--muted); font-size: 11.5px; margin-left: 4px; }
td.strong { font-weight: 600; }
td.notes { white-space: normal; min-width: 220px; color: var(--ink2); text-align: left; }
tr.cur td { background: var(--sel); }
table.hover tbody tr:hover td { background: var(--wash); }
table.stat td, table.stat th { padding-left: 6px; padding-right: 6px; }
table.stat tr:last-child td { border-bottom: 0; }
.scroll { overflow: auto; max-height: 440px; }
.scrollx { overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
pre.sum { background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; margin: 0 0 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 12px; color: var(--ink2); }
.filters label { display: inline-flex; align-items: center; gap: 5px; }
.steps { margin: 10px 0 0; padding-left: 20px; color: var(--ink2); }
.steps li { margin: 5px 0; }
.fld { display: flex; flex-direction: column; gap: 3px; }
.fld > span { font-size: 11.5px; color: var(--ink2); }

/* charts */
.ch-title { font-weight: 600; margin: 2px 0 2px; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink2); margin-bottom: 2px; min-height: 16px; }
.ch-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ch-legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.ch-legend i.pt { width: 8px; height: 8px; border: 0; border-radius: 50%; }
.ch-plot { position: relative; }
.ch-plot svg { display: block; width: 100%; }
.ch-plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ch-plot text.lab { fill: var(--ink2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 11.5px;
  box-shadow: 0 2px 10px rgba(0,0,0,.18); white-space: nowrap; display: none; z-index: 3; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip b { font-weight: 600; }
.bar { position: relative; min-width: 70px; height: 14px; background: var(--wash); border-radius: 0 4px 4px 0; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.bar > u { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink2); }
</style>
</head>
<body>
<header>
  <h1>E2 Test Explorer</h1>
  <nav id="nav">
    <button data-view="test" aria-selected="true">Tests</button>
    <button data-view="campaign">Campaign</button>
    <button data-view="model">Model</button>
  </nav>
  <div class="hd-right">
    <button id="assume" title="The efficiencies the model is run with. Change them on the Model page."></button>
    <span id="status"></span>
  </div>
</header>
<section class="view on" id="view-test">
  <aside class="pane" id="rail">
    <div class="rail-top">
      <button class="btn primary" id="new">New test</button>
      <input type="search" id="filter" placeholder="Filter tests" aria-label="Filter tests">
    </div>
    <div id="rail-list"></div>
    <div class="rail-foot">
      <div id="htl-state"></div>
      <label title="Six synthetic test points built from the model, to try the tool. Never saved."><input type="checkbox" id="demo"> Show demo tests</label>
    </div>
  </aside>
  <aside class="pane" id="inputs"></aside>
  <div id="work"><div id="thead"></div><div id="results"></div></div>
</section>
<section class="view" id="view-campaign"><div class="page" id="campaign"></div></section>
<section class="view" id="view-model"><div class="page" id="model"></div></section>
<div id="toast"></div>
<script>
"use strict";
// ------------------------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const has = v => v !== null && v !== undefined && !(typeof v === "number" && !isFinite(v));
const fx = (v, nd = 2, sign = false) => !has(v) ? "–" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(nd);
const num = s => { if (s === null || s === undefined) return null; s = String(s).trim().replace(",", "."); if (s === "") return null; const v = Number(s); return isFinite(v) ? v : NaN; };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const STATUS = {good: ["--good", "OK"], warn: ["--warn", "Check"], crit: ["--crit", "Off"], info: ["--info", "Note"]};
const ORDER = {crit: 0, warn: 1, good: 2, info: 3};
const AREA = {performance: "Performance", nozzle: "Nozzle", injector: "Injector", jacket: "Jacket"};
const st = lv => STATUS[lv] ? `--st:var(${STATUS[lv][0]})` : "";

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3600); }
function status(msg) { $("#status").textContent = msg; }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

// ------------------------------------------------------------------------------------ state
let META = null;
const S = {
  view: "test", tab: "performance", ymap: "pc", test: null, savedJson: null, sources: {}, origin: "", pullNote: "",
  eta_c: 0, eta_f: 0, demo: false, filter: "",
  A: null, err: null, W: null, Wpending: false, line: null, lineKey: "", pool: [], nextId: "E2-HF-001",
  runs: null, runsErr: "", qratio: {}, picked: new Set(), sort: {k: "date", d: -1}, trend: "r_eta_cstar", sx: "r_OF", sy: "r_eta_cstar",
  fHw: null, fOut: null, model: null, modelLine: null,
};
let seqA = 0, seqW = 0, seqL = 0, seqM = 0;

const today = () => new Date().toISOString().slice(0, 10);
function blankTest(hw) {
  const t = {test_id: S.nextId, date: today(), hardware: hw || "E2-REG-1", outcome: "pass", pressures_gauge: false, notes: "", source: "", inputs: {}};
  for (const f of META.fields) t.inputs[f.key] = f.default;
  return t;
}
const inputsKey = t => JSON.stringify([t.hardware, t.pressures_gauge, t.inputs, S.eta_c, S.eta_f]);
const recJson = t => JSON.stringify([t.test_id, t.date, t.hardware, t.outcome, t.pressures_gauge, t.notes, t.inputs]);
const dirty = () => S.savedJson !== recJson(S.test);
const isDemo = () => S.test.test_id.toUpperCase().startsWith("DEMO");
const isSaved = () => S.pool.some(p => p.saved && p.test.test_id === S.test.test_id);
const findings = () => !S.A ? [] : ((S.W && S.W.obs) || S.A.obs);
const worst = obs => obs.some(o => o[0] === "crit") ? "crit" : obs.some(o => o[0] === "warn") ? "warn" : "good";
const saveDraft = () => localStorage.setItem("e2x_draft2", JSON.stringify({test: S.test, sources: S.sources, origin: S.origin, pullNote: S.pullNote}));

// ------------------------------------------------------------------------------------ charts (SVG)
function ticks(lo, hi, n = 6) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return {vals: out, nd: Math.max(0, -Math.floor(Math.log10(step) + 1e-9))};
}
const sig = v => !has(v) ? "–" : Math.abs(v) >= 1000 ? v.toFixed(0) : Math.abs(v) >= 100 ? v.toFixed(1) : Math.abs(v) >= 10 ? v.toFixed(2) : v.toFixed(3);

/* chart(el, {title, xLabel, yLabel, height, series: [{name, x, y, color, width, dash, points, line, labels, r, rs, colors, tag, extra}],
              hlines: [{y, label, color, dash, fit}], vlines: [{x, label, color, dash}], bands: [{y0, y1, color}],
              cats, yRange, xRange, aspect, under(sx, sy), legend, forceLegend, xShort, yShort}) */
function chart(el, o) {
  const series = (o.series || []).filter(s => s && s.x && s.x.length);
  const named = series.filter(s => s.name);
  el.innerHTML = (o.title ? `<div class="ch-title">${esc(o.title)}</div>` : "") +
    `<div class="ch-legend">${(o.legend === false || named.length < 2 && !o.forceLegend) ? "" : named.map(s =>
      `<span><i class="${s.points ? "pt" : ""}" style="${s.points ? "background" : "border-color"}:${s.color};${s.dash ? "border-top-style:dashed" : ""}"></i>${esc(s.name)}</span>`).join("")}</div>` +
    `<div class="ch-plot"><svg></svg><div class="tip"></div></div>`;
  const svg = $("svg", el), tip = $(".tip", el), W = Math.max(280, el.clientWidth);
  const m = {l: 56, r: 18, t: 10, b: o.xLabel ? 42 : 26};
  const rot = o.cats && Math.max(...o.cats.map(c => String(c).length)) * 6.6 > (W - 74) / o.cats.length;
  if (rot) { m.b += 40; m.r = 46; }
  let xs = [], ys = [];
  for (const s of series) for (let i = 0; i < s.x.length; i++) { if (has(s.x[i])) xs.push(s.x[i]); if (has(s.y[i])) ys.push(s.y[i]); }
  for (const h of o.hlines || []) if (has(h.y) && h.fit !== false) ys.push(h.y);
  for (const b of o.bands || []) ys.push(b.y0, b.y1);
  if (!xs.length || !ys.length) { el.innerHTML += `<div class="empty">No data to plot.</div>`; return; }

  for (const v of o.vlines || []) if (has(v.x)) g += `<line x1="${sx(v.x)}" x2="${sx(v.x)}" y1="${m.t}" y2="${m.t + ph}" stroke="${v.color || "var(--muted)"}" stroke-width="1.3" stroke-dasharray="${v.dash === false ? "" : "2 4"}"/>`;
  for (const s of series) {

  for (const s of series) if (s.points) for (let i = 0; i < s.x.length; i++) {

async function loadRuns(reload) {

  catch (e) { d = {error: e.message}; }

  renderAssume(); await loadPool(); analyse(); if (S.view === "model") renderModel();
}
function renderAssume() {
  const changed = S.eta_c !== META.eta_c || S.eta_f !== META.eta_f;
  $("#assume").innerHTML = `Model &eta; c* ${fx(S.eta_c, 3)} · &eta; Cf,vac ${fx(S.eta_f, 3)} · ${changed ? "<b>changed from the baseline</b>" : "baseline rev " + esc(META.baseline.revision)}`;
}

// ------------------------------------------------------------------------------------ shell
function setView(v) {
  S.view = v;
  $$("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "view-" + v));
  if (v === "test") renderResults(); else if (v === "campaign") renderCampaign(); else renderModel();
}
async function init() {
  META = await api("/api/meta");
  S.eta_c = META.eta_c; S.eta_f = META.eta_f; renderAssume();
  S.demo = localStorage.getItem("e2x_demo") === "1"; $("#demo").checked = S.demo;
  buildInputs();
  const d = await api(`/api/tests?demo=${S.demo ? 1 : 0}&eta_c=${S.eta_c}&eta_f=${S.eta_f}`);
  S.pool = d.tests; S.nextId = d.next_id; fillQratio();
  let draft = null; try { draft = JSON.parse(localStorage.getItem("e2x_draft2")); } catch (e) {}
  if (draft && draft.test && draft.test.inputs && META.hardware[draft.test.hardware]) {
    const p = S.pool.find(p => p.saved && p.test.test_id === draft.test.test_id);
    loadTest(draft.test, false, {sources: draft.sources, origin: draft.origin, pullNote: draft.pullNote});
    if (p) { const ref = JSON.parse(JSON.stringify(p.test)); for (const f of META.fields) if (!(f.key in ref.inputs)) ref.inputs[f.key] = null;
      if (recJson(ref) === recJson(S.test)) { S.savedJson = recJson(S.test); renderHeader(); renderRail(); } }
  } else {
    const newest = S.pool.filter(p => p.saved).sort((a, b) => (b.test.date + b.test.test_id).localeCompare(a.test.date + a.test.test_id))[0];
    newest ? loadTest(newest.test, true, {origin: "saved"}) : loadTest(blankTest(), false);
  }
  $$("#nav button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("#assume").onclick = () => setView("model");
  $("#new").onclick = () => { if (confirmLeave()) { loadTest(blankTest(S.test.hardware), false); setView("test"); const f = $('[data-in="pc_bar"]'); if (f) f.focus(); } };
  $("#filter").oninput = e => { S.filter = e.target.value; renderRail(); };
  $("#demo").onchange = async e => { S.demo = e.target.checked; localStorage.setItem("e2x_demo", S.demo ? "1" : "0"); await loadPool(); analyse(); };
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => setView(S.view), 150); });
  // coming back from the Hopper Test Lab tab: a test saved there in the meantime shows up without a click
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadRuns(false); });
  loadRuns(false);
}
init().catch(e => { $("#work").innerHTML = `<div class="card empty">Could not reach the model server: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
