# =============================================================================
# H2 lander - mission analysis inputs
# -----------------------------------------------------------------------------
# Mission-specific inputs for mission_sizing.py. The engine (design point and
# throttle table), propellant temperatures and residuals come from the shared
# baseline named below. Units are part of every key name. Values marked "est."
# are estimates to be replaced by test data or by the output of the tool named
# in "source".
#
# Interfaces
#   mission_sizing.py      reads  this file + the baseline + its engine table
#                                                   -> writes mission_results.yaml
#   tank / pressurization sizing  reads mission_results.yaml (section handover)
#                                 and returns pressurant mass and vapour make-up
#                                 (section handback of its results), read below
# =============================================================================

meta:
  vehicle: H2 lander
  document: Mission Analysis (Notion, Systems Engineering)
  revision: E
  date: 2026-09-27
  owner: Luis

# Shared baseline (engine, propellant temperatures, residuals), relative to this file
baseline: ../baseline/h2_baseline.yaml

# -----------------------------------------------------------------------------
# Analysis settings
# -----------------------------------------------------------------------------
analysis:
  # Mission handed to the tank sizing as the sizing case; the other missions
  # are reported as check cases.
  #   hover: size for the Tethered Hover milestone only (current setting)
  #   hop:   size so that the tanks cover both missions (Mission Analysis
  #          sections 6-7); whether the hop is flown with the same hardware
  #          is still to be decided
  #   null:  mission with the largest usable propellant load
  sizing_case: hover

# -----------------------------------------------------------------------------
# Vehicle and mass point
# -----------------------------------------------------------------------------
vehicle:
  dry_mass_kg: 124.2             # incl. maturity margins, Mass Budget workbook Rev A
  ballast_min_kg: 15.0           # Lander Challenge payload rule
  liftoff_thrust_to_weight: 1.20 # sets the liftoff mass; ballast fills the rest

# -----------------------------------------------------------------------------
# Propellant tanks (present hardware)
# -----------------------------------------------------------------------------
propellant_tanks:
  initial_ullage_fraction: 0.05
  oxidizer:
    count: 2
    volume_each_L: 18.0
    # residual and loading temperature (warm end of the window) from the baseline
  fuel:
    count: 1
    volume_each_L: 6.9
    density_kg_m3: 789.0         # ethanol at 20 C

# -----------------------------------------------------------------------------
# Pressurization (output of the tank and pressurization sizing)
# -----------------------------------------------------------------------------
pressurization:
  # Handback of the tank sizing: loaded N2 and N2O vapour make-up, with the tank
  # volumes they were computed for. Both are scaled to the tank volumes of this
  # file (first order). Run order: mission_sizing.py -> tank tool -> mission_sizing.py.
  from_tank_results: ../tank_press_analysis/results/h2_tank_config_mission1_results.yaml
  # Manual values, used when from_tank_results is removed or its file does not
  # exist yet (fresh clone). Same meaning and scaling as the handback.
  source: Tank and Pressurization Sizing Rev B (present tanks)
  pressurant_mass_kg: 14.9       # N2 loaded, incl. 10 % margin
  n2o_vapour_makeup_kg: 4.1      # N2O ending the flight as ullage vapour
  reference:                     # tank volumes the two values above belong to
    propellant_volume_L: 42.9
    oxidizer_volume_L: 36.0

# -----------------------------------------------------------------------------
# Propellant allowances on top of the burned propellant
# -----------------------------------------------------------------------------
allowances:
  reserve_hover_s: 2.0           # H2-MIS-009, at touchdown mass
  control_fraction: 0.03         # est., per propellant, of burned mass

# -----------------------------------------------------------------------------
# Missions (same vehicle, same liftoff mass)
# -----------------------------------------------------------------------------
missions:
  hover:                         # Tethered Hover milestone, H2-MIS-001 to -010
    t_startup_s: 1.0             # on the pad at the throttle floor before liftoff
    hover_altitude_m: 1.5        # setpoint
    climb_rate_max_m_s: 1.0
    climb_accel_m_s2: 0.5
    count_altitude_m: 0.5        # hover counts above this height (null: hold only)
    hover_required_s: 10.0       # H2-MIS-001
    hover_margin_s: 1.0
    hover_hold_s: 11.0           # used only if count_altitude_m is null
    descent_rate_max_m_s: 0.7
    descent_accel_m_s2: 0.5
    touchdown_speed_m_s: 0.5     # H2-MIS-006: <= 1.0
    t_tailoff_s: 0.3
    ascent_time_limit_s: 8.0     # H2-MIS-005
  hop:                           # Bess Touchdown Award, flown as a 10 m hop
    t_startup_s: 1.0
    apex_m: 10.0
    climb_rate_max_m_s: 2.0
    climb_accel_m_s2: 0.7        # keeps liftoff throttle below 90 %
    apex_hold_s: 1.0             # zero velocity at the apex
    descent_rate_max_m_s: 1.5
    descent_accel_m_s2: 0.5
    stop_altitude_m: 0.8         # zero vertical velocity within 1 m of the ground
    stop_hold_s: 1.0
    touchdown_speed_m_s: 0.5
    t_tailoff_s: 0.3
